# Deployment step for Woodpecker CI/CD
# Ephemeral volumes - Data is not persisted across deployments (i.e. database volume)
# Remove line 29 for persistent volumes

steps:
  - name: deploy
    image: alpine:latest
    environment:
      SSH_KEY:
        from_secret: SSH_KEY
      REGISTRY_IMAGE_TAG:
        from_secret: REGISTRY_IMAGE_TAG
      SSH_HOST: root@10.0.10.115
      PROJECT_DIRECTORY: /mnt/nvme/files/docker\ projects/service_queue/REPLACE-ME
      DOCKER_VOLUME_DB: REPLACE-ME
      DOCKER_COMPOSE_URL: REPLACE-ME
    commands:
      - apk add openssh
      - mkdir -p /root/.ssh/
      - echo "$SSH_KEY" | tr -d '\r' > /root/.ssh/id_rsa
      - chmod 600 /root/.ssh/id_rsa
      - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > /root/.ssh/config
      - ssh "$SSH_HOST" "
        cd "$PROJECT_DIRECTORY";
        docker compose down;
        docker image rm "$REGISTRY_IMAGE_TAG" || true;
        docker volume rm "$DOCKER_VOLUME_DB" || true;
        wget -O docker compose.yml "$DOCKER_COMPOSE_URL";
        docker pull "$REGISTRY_IMAGE_TAG";
        docker compose up -d;
        docker image prune -af;
        sleep 60;
        docker compose logs;"
    volumes:
      - /var/cache/apk:/etc/apk/cache

when:
  - branch: master
    event:
      - push
      - manual

depends_on:
  - build

skip_clone: true
