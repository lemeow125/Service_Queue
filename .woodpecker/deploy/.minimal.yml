# Deployment step for Woodpecker CI/CD

# Basic template, no container registry needed
# CI runs pinned via $CI_COMMIT_SHA, idempotent

# Git-backed fetching of changes
# Image built locally, no container registry used

steps:
  - name: deploy
    image: alpine:latest
    environment:
      SSH_KEY:
        from_secret: SSH_KEY
      SSH_HOST: root@10.0.10.222
      REGISTRY_IMAGE_TAG: REPLACE-ME
      PROJECT_DIRECTORY: /mnt/nvme2/files/docker\ projects/service_queue/REPLACE-ME
    commands:
      - apk add openssh
      - mkdir -p /root/.ssh/
      - echo "$SSH_KEY" | tr -d '\r' > /root/.ssh/id_rsa
      - chmod 600 /root/.ssh/id_rsa
      - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > /root/.ssh/config
      - ssh "$SSH_HOST" "
        set -e;
        cd "$PROJECT_DIRECTORY";
        docker compose down;
        docker image rm "$REGISTRY_IMAGE_TAG" || true;
        git fetch origin --prune --force;
        git reset --hard "$CI_COMMIT_SHA";
        docker compose build;
        docker compose up -d;
        docker image prune -af;
        sleep 60;
        docker compose logs;"
    volumes:
      - /var/cache/apk:/etc/apk/cache

when:
  - branch: master
    event:
      - push
      - manual

skip_clone: true
