# Deployment step for Woodpecker CI/CD

# Basic template, no container registry needed
# WARNING: Older CI runs will not work correctly with this setup, push newer commit fixes instead

# Git-backed docker-compose.yml fetching
# Image built locally, no container registry used

steps:
  - name: deploy
    image: alpine:latest
    environment:
      SSH_KEY:
        from_secret: SSH_KEY
      SSH_HOST: root@10.0.10.222
      PROJECT_DIRECTORY: /mnt/nvme2/files/docker\ projects/service_queue/REPLACE-ME
    commands:
      - apk add openssh
      - mkdir -p /root/.ssh/
      - echo "$SSH_KEY" | tr -d '\r' > /root/.ssh/id_rsa
      - chmod 600 /root/.ssh/id_rsa
      - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > /root/.ssh/config
      - ssh "$SSH_HOST" "
        cd "$PROJECT_DIRECTORY";
        docker compose down;
        docker image prune -af;
        git restore . && git pull origin "$CI_COMMIT_BRANCH" --force --rebase;
        docker compose build;
        docker compose up -d;
        sleep 60;
        docker compose logs;"
    volumes:
      - /var/cache/apk:/etc/apk/cache

when:
  - branch: master
    event:
      - push
      - manual

skip_clone: true