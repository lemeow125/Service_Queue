# Build step for Woodpecker CI/CD using Docker Hub as container registry

labels:
  platform: linux/amd64

steps:
  - name: build
    image: docker
    environment:
      DOCKERHUB_USERNAME:
        from_secret: DOCKERHUB_USERNAME
      DOCKERHUB_TOKEN:
        from_secret: DOCKERHUB_TOKEN
      REGISTRY_IMAGE: REPLACE-ME # Use $CI_COMMIT_SHA for container version, do not append latest
    commands:
      - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - |
        if docker manifest inspect "$REGISTRY_IMAGE:$CI_COMMIT_SHA" > /dev/null 2>&1; then
          echo "Image $REGISTRY_IMAGE:$CI_COMMIT_SHA already exists – skipping build."
          exit 0
        fi
      - docker buildx build --push --platform linux/amd64,linux/arm64 -t "$REGISTRY_IMAGE:$CI_COMMIT_SHA" .

volumes:
  - /var/run/docker.sock:/var/run/docker.sock

when:
  - branch: master
    event:
      - push
      - manual